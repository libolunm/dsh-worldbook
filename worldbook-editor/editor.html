<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界书 · DSH</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7fb;--panel:#fff;--ink:#202937;--muted:#718096;--line:#e5e9f0;--accent:#486de1;--soft:#eef2ff;--green:#278363;--red:#ba4444;--shadow:0 8px 32px #20304a08;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;font-size:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8098ee;outline-offset:2px}header{padding:25px 28px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--panel)}h1{font-size:23px;letter-spacing:-.5px;margin:0 0 6px}p{margin:0;color:var(--muted);line-height:1.7}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700;margin-bottom:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}.danger{color:var(--red)}.toolbar{padding:12px 28px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}#status[data-kind=error]{color:var(--red)}#status[data-kind=success]{color:var(--green)}.workspace{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:calc(100vh - 154px)}aside{border-right:1px solid var(--line);padding:19px 16px;background:var(--panel)}.search{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px}.filters{display:flex;gap:5px;margin:12px 0 18px}.filter{border:0;background:transparent;color:var(--muted);padding:6px 8px;border-radius:7px;font-size:12px}.filter.active{background:var(--soft);color:var(--accent)}#list{display:grid;gap:7px;align-content:start}.entry{text-align:left;width:100%;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);padding:13px 11px}.entry:hover{background:var(--bg)}.entry.selected{background:var(--soft);border-color:#bfcdf6}.entry strong{font-size:13px;display:block;line-height:1.5;overflow-wrap:anywhere}.entry small{display:block;margin-top:8px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--green)}.dot.blue{background:var(--accent)}.dot.off{background:#9aa1ac}.main{padding:24px 30px 32px;max-width:960px;width:100%;margin:0 auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}.field{display:block;margin-bottom:22px}.label{display:block;font-size:12px;font-weight:650;margin-bottom:8px}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:7px}.input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--ink);padding:11px 12px}.title-input{font-size:18px;font-weight:600}textarea{min-height:220px;resize:vertical;line-height:1.8}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{padding:13px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}.mode.active{border-color:var(--accent);background:var(--soft)}.mode strong{font-size:13px}.mode span{font-size:11px;display:block;color:var(--muted);margin:5px 0 0 15px;line-height:1.6}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:17px}.check{display:flex;gap:8px;align-items:center;font-size:12px}.check input{accent-color:var(--accent)}.empty{text-align:center;padding:80px 12px;color:var(--muted);line-height:1.9}.empty strong{font-size:18px;color:var(--ink)}#entry-id{font:11px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.footnote{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.8}.keyword-options{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px}.keyword-options select{max-width:230px}.toast{padding:12px 16px;margin:0 0 18px;border:1px solid #e4b08d;background:#fff6e9;border-radius:9px;color:#93612d;font-size:12px;line-height:1.7}[hidden]{display:none!important}
@media(prefers-color-scheme:dark){:root{--bg:#15191f;--panel:#1c222b;--ink:#e5eaf1;--muted:#96a3b5;--line:#303947;--accent:#829eff;--soft:#293451;--green:#6ac6a4;--red:#f58c8c}.primary{color:#131b30}.entry.selected{border-color:#51648f}.toast{background:#382d20;color:#f5c895;border-color:#70573b}}
@media(max-width:720px){header{padding:18px}.toolbar{padding:10px 18px}.workspace{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px 18px}#list{display:flex;overflow:auto;max-height:140px}.entry{min-width:160px;width:190px;flex-shrink:0}.filters{margin:8px 0}.main{padding:16px}.card{padding:17px}.modes{gap:7px}header p{font-size:12px}.keyword-options{align-items:flex-start;flex-direction:column}}@media(max-width:440px){header{align-items:flex-start;flex-direction:column}.modes{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:flex-start}}
</style></head><body>
<header><div><div class="eyebrow">DSH / PERSONAL MEMORY</div><h1>世界书</h1><p>把需要反复提醒的事，留在这里。</p></div><div class="actions"><button class="button" id="reload">重新读取</button><button class="button primary" id="save" disabled>保存更改</button></div></header>
<div class="toolbar"><span id="counts">正在读取…</span><span id="status" role="status" aria-live="polite"></span></div>
<div class="workspace"><aside><input id="search" class="search" placeholder="搜索标题、内容或关键词" aria-label="搜索世界书"><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="constant">蓝灯</button><button class="filter" data-filter="keyword">绿灯</button><button class="filter" data-filter="disabled">停用</button></div><div id="list"></div><button id="add" class="button" style="width:100%;margin-top:16px" disabled>＋ 新增条目</button></aside>
<main class="main"><div class="toast" id="notice" hidden></div><div id="empty" class="empty"><strong>世界书</strong><br>正在读取你的条目…</div><form id="form" class="card" hidden>
<label class="field"><span class="label">标题</span><input id="title" class="input title-input" maxlength="200" placeholder="例如：Krea2 默认工作流" required></label>
<div class="field"><span class="label">激活方式</span><div class="modes"><button type="button" class="mode" id="blue" aria-pressed="false"><strong><i class="dot blue"></i>蓝灯 · 常驻</strong><span>每次调用都携带，无需关键词。</span></button><button type="button" class="mode" id="green" aria-pressed="false"><strong><i class="dot"></i>绿灯 · 关键词</strong><span>提到相关词时，自动带入条目。</span></button></div></div>
<div class="field" id="keywords-field"><label><span class="label">触发关键词</span><input id="keys" class="input" placeholder="跑图，Krea2，工作流"><div class="hint">用逗号、中文逗号或换行分隔；命中任意一个即可触发。</div></label><div class="keyword-options"><label class="check"><input type="checkbox" id="case-sensitive">区分大小写</label><select id="repeat" class="input" aria-label="触发频率"><option value="once">每会话首次命中</option><option value="always">每次新消息命中</option></select></div></div>
<label class="field"><span class="label">记忆内容</span><textarea id="content" class="input" placeholder="写下需要记住的偏好、路径、规则或背景。" required></textarea><div class="hint" id="content-hint">内容会作为背景资料提供给使用世界书预设的 Agent。</div></label>
<div class="bottom"><label class="check"><input type="checkbox" id="enabled">启用此条目</label><button type="button" id="delete" class="button danger">删除条目</button></div><div style="margin-top:15px" id="entry-id"></div></form><div class="footnote">适用于「世界书 · 酒馆模式」预设。修改先保留在本页，点击“保存更改”后写入世界书。<br>蓝灯随下次模型调用更新；旧对话中已经出现的背景资料不会从历史中抹除。</div></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let book=null,revision=null,selected=null,dirty=false,busy=false,filter='all';
const current=()=>book?.entries.find(e=>e.id===selected);const setStatus=(text,kind='')=>{$('status').textContent=text;$('status').dataset.kind=kind};
function changed(){dirty=true;controls();setStatus('有未保存的更改')}
function controls(){$('save').disabled=!book||!dirty||busy;$('save').textContent=busy?'正在保存…':'保存更改';$('add').disabled=!book||busy;$('reload').disabled=busy;document.querySelectorAll('#form input,#form textarea,#form button,#form select').forEach(e=>e.disabled=busy)}
function stats(){if(!book)return;const all=book.entries;$('counts').textContent=`${all.length} 条记忆 · ${all.filter(e=>e.constant&&e.enabled!==false).length} 蓝灯 · ${all.filter(e=>!e.constant&&e.enabled!==false).length} 绿灯 · ${all.filter(e=>e.enabled===false).length} 停用`}
function renderList(){if(!book)return;stats();const q=$('search').value.trim().toLowerCase();const list=$('list');list.replaceChildren();const entries=book.entries.filter(e=>(filter==='all'||filter==='disabled'&&e.enabled===false||filter==='constant'&&e.constant||filter==='keyword'&&!e.constant)&&[e.title,e.content,...(e.keys||[])].join('\n').toLowerCase().includes(q));for(const entry of entries){const b=document.createElement('button');b.className='entry'+(entry.id===selected?' selected':'');b.type='button';b.setAttribute('aria-current',entry.id===selected?'true':'false');const strong=document.createElement('strong');const dot=document.createElement('i');dot.className='dot '+(entry.enabled===false?'off':entry.constant?'blue':'');strong.append(dot,document.createTextNode(entry.title||'未命名条目'));const small=document.createElement('small');small.textContent=entry.enabled===false?'已停用':entry.constant?'常驻 · 无需关键词':(entry.keys||[]).join(' / ')||'尚未填写关键词';b.append(strong,small);b.onclick=()=>{selected=entry.id;renderList();renderForm()};list.append(b)}if(!entries.length){const p=document.createElement('p');p.style.padding='16px 8px';p.textContent='没有匹配的条目';list.append(p)}}
function modes(){const e=current();if(!e)return;$('blue').classList.toggle('active',!!e.constant);$('green').classList.toggle('active',!e.constant);$('blue').setAttribute('aria-pressed',String(!!e.constant));$('green').setAttribute('aria-pressed',String(!e.constant));$('keywords-field').hidden=!!e.constant}
function renderForm(){const e=current();$('form').hidden=!e;$('empty').hidden=!!e;if(!e){$('empty').textContent=book?'从左侧选择条目，或新增一条记忆。':'无法读取世界书，请点击“重新读取”重试。';return}$('title').value=e.title||'';$('content').value=e.content||'';$('keys').value=(e.keys||[]).join('，');$('enabled').checked=e.enabled!==false;$('case-sensitive').checked=!!e.caseSensitive;$('repeat').value=e.repeat==='always'?'always':'once';$('entry-id').textContent='ID · '+e.id;modes();controls()}
async function request(method,payload){const res=await fetch('/worldbook/api',{method,credentials:'same-origin',headers:payload?{'Content-Type':'application/json'}:{},body:payload?JSON.stringify(payload):undefined});let data;try{data=await res.json()}catch{throw Error('DSH 返回了无法识别的响应，请确认编辑器服务已启动。')}if(!res.ok){const error=Error(data.error||data.message||`请求失败（${res.status}）`);error.status=res.status;throw error}return data}
async function load(){if(dirty&&!confirm('重新读取会放弃本页尚未保存的修改，是否继续？'))return;try{setStatus('正在读取…');const data=await request('GET');book=data.book;revision=data.revision;selected=book.entries.some(e=>e.id===selected)?selected:book.entries[0]?.id||null;dirty=false;$('notice').hidden=true;renderList();renderForm();controls();setStatus('已读取','success')}catch(error){setStatus(error.message,'error');if(!book)renderForm()}}
function validate(){for(const e of book.entries){if(!(e.title||'').trim())return {e,message:'请填写条目标题。'};if(!(e.content||'').trim())return {e,message:'请填写记忆内容。'};if(!e.constant&&e.enabled!==false&&!(e.keys||[]).length)return {e,message:'绿灯条目需要至少一个触发关键词。'}}}
async function save(){if(busy||!dirty)return;const invalid=validate();if(invalid){selected=invalid.e.id;renderList();renderForm();setStatus(invalid.message,'error');return}busy=true;controls();try{const result=await request('PUT',{book,revision});book=result.book||book;revision=result.revision;dirty=false;$('notice').hidden=true;setStatus('已保存 · 下次模型调用读取新内容','success');renderList()}catch(error){setStatus(error.message,'error');if(error.status===409){$('notice').hidden=false;$('notice').textContent='世界书已被其他页面或 Agent 修改。本页草稿仍在，尚未覆盖文件。请先复制需要保留的内容，再点击“重新读取”合并修改。'}}finally{busy=false;controls()}}
function update(key,value){const e=current();if(!e)return;e[key]=value;changed();renderList()}
$('title').oninput=e=>update('title',e.target.value);$('content').oninput=e=>update('content',e.target.value);$('keys').oninput=e=>update('keys',[...new Set(e.target.value.split(/[,，\n]/).map(k=>k.trim()).filter(Boolean))]);$('enabled').onchange=e=>update('enabled',e.target.checked);$('case-sensitive').onchange=e=>update('caseSensitive',e.target.checked);$('repeat').onchange=e=>update('repeat',e.target.value);$('blue').onclick=()=>{update('constant',true);modes()};$('green').onclick=()=>{update('constant',false);modes()};$('search').oninput=renderList;
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderList()});
$('add').onclick=()=>{const entry={id:'entry-'+crypto.randomUUID(),title:'',content:'',constant:true,keys:[],enabled:true,repeat:'once',caseSensitive:false};book.entries.push(entry);selected=entry.id;filter='all';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));$('search').value='';changed();renderList();renderForm();$('title').focus()};
$('delete').onclick=()=>{const e=current();if(!e||!confirm(`删除“${e.title||'未命名条目'}”？点击“保存更改”后才会写入文件。`))return;const i=book.entries.indexOf(e);book.entries.splice(i,1);selected=book.entries[Math.min(i,book.entries.length-1)]?.id||null;changed();renderList();renderForm()};$('reload').onclick=load;$('save').onclick=save;$('form').onsubmit=e=>{e.preventDefault();save()};addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();save()}});load();
</script></body></html>
